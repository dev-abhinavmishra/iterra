<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="iterra is a local-first study workspace that unifies planning, flashcards, notes, timers, calculations, attendance, assessments, and study materials around your courses."
    />
    <title>iterra — an integrated study terrain</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Iterra" />
    <meta property="og:title" content="Iterra — an integrated study terrain" />
    <meta
      property="og:description"
      content="Eight study tools under one roof — planning, notes, flashcards, timers, calculations, attendance, assessments, and study materials — local-first and course-aware."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Iterra — an integrated study terrain" />
    <meta
      name="twitter:description"
      content="Eight study tools under one roof — planning, notes, flashcards, timers, calculations, attendance, assessments, and study materials — local-first and course-aware."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171c" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Zilla+Slab:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Source+Sans+3:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400;500;600;700&family=Libre+Franklin:wght@400;500;600;700;800&family=Courier+Prime:wght@400;700&family=Caveat:wght@400..700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..24,300..400,0..1&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="max-width: 34rem; margin: 20vh auto; padding: 0 1.5rem; font-family: Georgia, serif; color: #2a2a26; text-align: center"
      >
        <h1 style="font-size: 1.4rem; font-weight: 600">Iterra needs JavaScript</h1>
        <p style="margin-top: 0.75rem; line-height: 1.6">
          It’s a local-first study workspace — every tool runs in your browser
          and your data never leaves this device — so it can’t run with
          JavaScript disabled. Enable it and reload to open your terrain.
        </p>
      </div>
    </noscript>
    <script>
      window.__iterraIntegrated = true;
      try {
        var t = localStorage.getItem('iterra.v1.theme');
        document.documentElement.dataset.theme = t === 'graphite' ? 'graphite' : 'paper';
      } catch (e) { /* private mode — default theme */ }
    </script>
    <script src="/iterra-hub.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
