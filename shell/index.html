  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="max-width: 34rem; margin: 20vh auto; padding: 0 1.5rem; font-family: Georgia, serif; color: #2a2a26; text-align: center"
      >
        <h1 style="font-size: 1.4rem; font-weight: 600">Iterra needs JavaScript</h1>
        <p style="margin-top: 0.75rem; line-height: 1.6">
          It’s a local-first study workspace that runs in your browser,
          so it can’t run with
          JavaScript disabled. Enable it and reload to open your terrain.
        </p>
      </div>
    </noscript>
    <script>
      window.__iterraIntegrated = true;
      try {
        var t = localStorage.getItem('iterra.v1.theme');
        document.documentElement.dataset.accent = localStorage.getItem('iterra.v1.accent') || 'green';
        /* an explicit choice wins; with none stored, follow the OS —
           a night-time first run shouldn't flash paper */
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          t === 'graphite' ? 'graphite' : t === 'paper' ? 'paper' : dark ? 'graphite' : 'paper';
      } catch (e) { /* private mode — default theme */ }
    </script>
    <script src="/iterra-hub.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
